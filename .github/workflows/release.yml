name: Release

on:
  push:
    tags:
      - 'Version_*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Must be set before actions/setup-node so .npmrc gets the auth token.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on dev tip
        id: tag
        run: |
          git fetch origin dev
          TAG="${GITHUB_REF_NAME}"
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          DEV_HEAD="$(git rev-parse origin/dev)"

          case "$TAG" in
            Version_[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Release tag must match Version_X.Y.Z (e.g. Version_1.0.0), got ${TAG}"
              exit 1
              ;;
          esac

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/dev; then
            echo "::error::Tag ${TAG} (${TAG_COMMIT}) is not reachable from origin/dev"
            exit 1
          fi

          if [ "$DEV_HEAD" != "$TAG_COMMIT" ]; then
            echo "::error::Release tag ${TAG} must point to origin/dev HEAD"
            echo "  dev HEAD: ${DEV_HEAD}"
            echo "  tag commit: ${TAG_COMMIT}"
            exit 1
          fi

          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          TAG_VERSION="${TAG#Version_}"

          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} must match package.json version (${VERSION})"
            exit 1
          fi

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PKG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Verify npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty"
            exit 1
          fi
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > .npmrc
          npm whoami --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Pack tarball
        run: pnpm pack

      - name: Check npm registry
        id: npm
        run: |
          PKG="${{ steps.tag.outputs.package_name }}"
          VERSION="${{ steps.tag.outputs.version }}"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "npm ${PKG}@${VERSION} already exists; skip publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.npm.outputs.already_published != 'true'
        run: pnpm publish --access public --no-git-checks --registry https://registry.npmjs.org

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ steps.tag.outputs.tag_commit }}
          generate_release_notes: true
          overwrite: true
          files: create-vben-admin-*.tgz

      - name: Squash merge dev to main
        if: success() && (steps.npm.outputs.already_published == 'true' || steps.publish.outcome == 'success')
        env:
          TAG: ${{ steps.tag.outputs.tag_name }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
          PKG: ${{ steps.tag.outputs.package_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git fetch origin dev main

          if git diff --quiet origin/main origin/dev; then
            echo "origin/main already matches origin/dev; skip squash merge"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Use soft reset instead of merge --squash: after a prior release squash,
          # main and dev share no merge base for the same hunks and merge --squash conflicts.
          git checkout -B main origin/dev
          git reset --soft origin/main
          git commit \
            -m "release(${VERSION}): publish ${PKG} CLI" \
            -m "Tag: ${TAG} @ ${TAG_COMMIT}" \
            -m "npm: https://www.npmjs.com/package/${PKG}" \
            -m "dev: squash merged after successful Release workflow"
          git push origin main
